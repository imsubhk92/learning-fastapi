[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-fastapi"
version = "0.1.0"
description = "A small food-order API and FastAPI revision guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=17.3,<18",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16,<3", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
